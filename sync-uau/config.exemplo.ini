; Copie este arquivo para "config.ini" e preencha.
; O config.ini fica só no computador que roda a sincronização (não vai para o GitHub).

[uau]
; Servidor SQL Server do UAU, como aparece no SQL Server Management Studio.
; Ex.: SERVIDOR-ERP  ou  SERVIDOR-ERP\SQLEXPRESS  ou  192.168.0.10,1433
servidor = SERVIDOR-ERP
banco = UAU
; Usuário SOMENTE LEITURA criado com o script criar_usuario_leitura.sql
usuario = leitura_app
senha = TROQUE_AQUI
; Driver ODBC instalado no Windows (veja o LEIAME). Normalmente um destes:
; ODBC Driver 18 for SQL Server  |  ODBC Driver 17 for SQL Server
driver = ODBC Driver 18 for SQL Server
; Em rede interna sem certificado no SQL Server, deixe "sim".
confiar_certificado = sim
; Tempo máximo (segundos) para cada consulta.
tempo_limite = 600

[planilha]
; Pasta onde as planilhas geradas ficam salvas.
pasta_saida = C:\SyncUAU\planilhas
; Nome do arquivo. {data} vira a data/hora da geração (ex.: 2026-10-27_1400).
nome_arquivo = Base UAU {data}.xlsx
; Também grava uma cópia com nome fixo (sempre a mais recente). Deixe vazio para não gravar.
copia_fixa = Base UAU - atual.xlsx
; Quantas planilhas antigas manter na pasta (as mais velhas são apagadas).
manter_ultimas = 30

[supabase]
; Como a planilha chega ao app:
;   nao      = só gera a planilha (você sobe no app como hoje)
;   arquivo  = envia a planilha para o Storage do Supabase (um bucket)
;   tabelas  = grava as linhas de cada aba direto nas tabelas do Supabase
envio = nao
url = https://SEU-PROJETO.supabase.co
; Chave "service_role" (ou secret key) do projeto. Nunca coloque no app nem no GitHub.
chave = COLE_A_CHAVE_AQUI
; Para envio = arquivo
bucket = planilhas-uau
pasta_bucket = uau
; Para envio = tabelas: "substituir" apaga e regrava a tabela inteira;
; "atualizar" faz upsert pela coluna-chave definida em cada aba abaixo.
modo_tabelas = substituir

; ---------------------------------------------------------------------------
; Uma seção [aba:NOME] para cada aba da planilha.
;   consulta = arquivo .sql dentro da pasta "consultas"
;   tabela   = (opcional) tabela do Supabase que recebe as linhas, para envio = tabelas
;   chave    = (opcional) coluna(s) única(s) para modo_tabelas = atualizar, separadas por vírgula
; ---------------------------------------------------------------------------

[aba:Base - Info UAU]
consulta = exemplo_pedidos.sql
tabela = uau_pedidos
chave = Empresa,Obra,Num_Processo_Pedido,Parcela
